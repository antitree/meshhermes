# Manual minor release: 1.0.7 -> 1.1.0.
#
# Run it from the Actions tab when the accumulated patch bumps add up to
# something worth calling a release.  Unlike the automatic patch bump, this
# one publishes a GitHub Release, with notes taken from CHANGELOG.md — the
# reason patch bumps only tag: so the Releases page stays a list of things
# worth reading rather than one entry per merged PR.
#
# There is deliberately no major (2.0.0) option. That is a decision to make
# by hand, not a dropdown.
name: release (minor, manual)

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Print the bump without committing, tagging, or publishing"
        type: boolean
        default: false

permissions:
  contents: write

# Share the group with the automatic patch bump: a release and a merge
# landing at the same moment would otherwise both write main.
concurrency:
  group: version-bump
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.2.2
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: true

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip >/dev/null
          python -m pip install pyyaml >/dev/null

      # The release is cut from main as it stands; if main is red, the
      # release would ship it. Cheap insurance compared to a bad tag.
      - name: Run the test suite before releasing
        run: |
          python -m pip install pytest pytest-asyncio pypubsub >/dev/null
          pytest -q

      - name: Bump the minor version
        id: bump
        run: |
          python scripts/bump_version.py minor ${{ inputs.dry_run && '--dry-run' || '' }} | tee /tmp/bump.out
          grep -E '^(old_version|new_version|tag)=' /tmp/bump.out >> "$GITHUB_OUTPUT"

      - name: Verify the three declarations still agree
        if: ${{ !inputs.dry_run }}
        run: |
          python - <<'PY'
          import pathlib, re, sys, yaml
          root = pathlib.Path(".")
          toml = re.search(r'(?m)^version\s*=\s*"([^"]+)"', (root / "pyproject.toml").read_text()).group(1)
          manifest = str(yaml.safe_load((root / "plugin.yaml").read_text())["version"])
          init = re.search(r'__version__\s*=\s*"([^"]+)"', (root / "__init__.py").read_text()).group(1)
          versions = {"pyproject.toml": toml, "plugin.yaml": manifest, "__init__.py": init}
          if len(set(versions.values())) != 1:
              sys.exit(f"version mismatch after bump: {versions}")
          print("version consistent:", toml)
          PY

      # Notes come from the CHANGELOG section for the new version. An empty
      # or missing section must not become an empty Release, so fall back to
      # a compare link that at least tells the reader what changed.
      - name: Extract the release notes from CHANGELOG.md
        id: notes
        env:
          NEW_VERSION: ${{ steps.bump.outputs.new_version }}
          OLD_VERSION: ${{ steps.bump.outputs.old_version }}
        run: |
          python - <<'PY' > /tmp/notes.md
          import os, pathlib, sys
          sys.path.insert(0, "scripts")
          from bump_version import extract_changelog_section

          new = os.environ["NEW_VERSION"]
          old = os.environ["OLD_VERSION"]
          repo = "https://github.com/antitree/meshhermes"
          changelog = pathlib.Path("CHANGELOG.md").read_text()

          body = extract_changelog_section(changelog, new)
          if not body:
              # The automatic bump only ever writes a stub, and a hand-written
              # section may not exist yet for this minor version.
              body = (
                  f"No CHANGELOG entry was written for {new}.\n\n"
                  f"See the [full diff]({repo}/compare/v{old}...v{new})."
              )
          print(body)
          PY
          echo "Release notes:"
          cat /tmp/notes.md

      - name: Commit, tag, and publish the release
        if: ${{ !inputs.dry_run }}
        env:
          GH_TOKEN: ${{ github.token }}
          NEW_VERSION: ${{ steps.bump.outputs.new_version }}
          TAG: ${{ steps.bump.outputs.tag }}
        run: |
          set -euo pipefail
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          if ! git diff --quiet; then
            git add pyproject.toml plugin.yaml __init__.py CHANGELOG.md
            # [skip ci] for the same reason as the patch bump: a
            # GITHUB_TOKEN push does not trigger workflows, and the marker
            # keeps that true if the token is ever swapped for a PAT.
            git commit -m "chore(release): ${NEW_VERSION} [skip ci]"
            git push origin HEAD:main
          else
            echo "No version change to commit (already at ${NEW_VERSION})."
          fi

          if git ls-remote --exit-code --tags origin "refs/tags/${TAG}" >/dev/null 2>&1; then
            echo "::warning::Tag ${TAG} already exists on origin; not re-tagging."
          else
            git tag -a "${TAG}" -m "MeshHermes ${NEW_VERSION}"
            git push origin "${TAG}"
          fi

          # A re-run after a partial failure should not die on "release
          # already exists"; update the existing one instead.
          if gh release view "${TAG}" >/dev/null 2>&1; then
            echo "::warning::Release ${TAG} exists; updating its notes."
            gh release edit "${TAG}" --notes-file /tmp/notes.md --title "MeshHermes ${NEW_VERSION}"
          else
            gh release create "${TAG}" \
              --title "MeshHermes ${NEW_VERSION}" \
              --notes-file /tmp/notes.md \
              --verify-tag
          fi

      - name: Summary
        run: |
          {
            echo "### Release ${{ steps.bump.outputs.new_version }}"
            echo
            echo "\`${{ steps.bump.outputs.old_version }}\` → \`${{ steps.bump.outputs.new_version }}\` (minor)"
            echo
            if [ "${{ inputs.dry_run }}" = "true" ]; then
              echo "**Dry run** — nothing was committed, tagged, or published."
            else
              echo "Tagged \`${{ steps.bump.outputs.tag }}\` and published a GitHub Release."
            fi
            echo
            echo '<details><summary>Release notes</summary>'
            echo
            cat /tmp/notes.md
            echo
            echo '</details>'
          } >> "$GITHUB_STEP_SUMMARY"
