name: tests

on:
  push:
    branches: [main]
  pull_request:

# Least privilege: this workflow only reads the repo. Without this block
# the default token scope is whatever the repository setting allows.
permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]

    steps:
      # Actions are pinned to commit SHAs, not mutable tags: a tag can be
      # repointed at new code, which is a supply-chain risk. This mirrors
      # the exact version pinning used for Python deps in pyproject.toml.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.2.2

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install test dependencies
        # No hardware and no Hermes checkout: the suite stubs the gateway
        # surface and drives a fake radio over real pubsub topics.
        run: |
          python -m pip install --upgrade pip
          python -m pip install pytest pytest-asyncio pypubsub pyyaml

      - name: Run tests
        run: pytest -q

      - name: Verify the plugin manifest
        run: |
          python - <<'PY'
          import yaml
          m = yaml.safe_load(open("plugin.yaml"))
          assert m["kind"] == "platform", m
          # Must match ctx.register_platform(name=...) in adapter.py.
          assert m["name"] == "meshtastic", m
          print("plugin.yaml OK:", m["name"], m["version"])
          PY

      - name: Verify versions agree across the three places they appear
        run: |
          python - <<'PY'
          import re, pathlib, yaml
          try:
              import tomllib  # 3.11+
          except ModuleNotFoundError:
              # 3.10 has no tomllib; the version line is simple enough to read
              # directly rather than pull in a tomli dependency just for CI.
              tomllib = None
          text = pathlib.Path("pyproject.toml").read_text()
          if tomllib is not None:
              pyproject = tomllib.loads(text)
          else:
              m = re.search(r'^version\s*=\s*"([^"]+)"', text, re.M)
              pyproject = {"project": {"version": m.group(1)}}
          manifest = yaml.safe_load(pathlib.Path("plugin.yaml").read_text())
          init = pathlib.Path("__init__.py").read_text()
          init_version = re.search(r'__version__\s*=\s*"([^"]+)"', init).group(1)
          versions = {
              "pyproject.toml": pyproject["project"]["version"],
              "plugin.yaml": str(manifest["version"]),
              "__init__.py": init_version,
          }
          assert len(set(versions.values())) == 1, f"version mismatch: {versions}"
          print("version consistent:", versions["pyproject.toml"])
          PY

      - name: Byte-compile shipped scripts
        # smoke_hardware.py never runs in CI (it needs a radio), so a syntax
        # error in it would otherwise reach users undetected.
        run: python -m compileall -q scripts/ *.py

  packaging:
    # The pip-install path is a shipped install method; verify it builds and
    # imports rather than discovering it is broken after a release.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.2.2

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.11"

      - name: Build the distribution
        run: |
          python -m pip install --upgrade pip build twine
          python -m build

      - name: Check package metadata
        run: python -m twine check dist/*

      - name: Install the built wheel and import its modules
        run: |
          python -m pip install dist/*.whl
          python -c "import normalize, chunking, policy; print('modules import OK')"
